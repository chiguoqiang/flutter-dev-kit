# ============================================================
# 技术选型 · 唯一事实源（本项目所有工具与 Agent 以本文件为准）
# ------------------------------------------------------------
# 用法：新建项目后按需修改本文件 → 告诉 Agent「按 tech-stack 调整」；
#      改动会同步到根 AGENTS.md、pubspec.yaml 与对应库规范。
# 约定：state/route/serialize/network 可选项见 kit 的 PLAYBOOK-NEW-PROJECT 阶段0；
#      architecture 换非 MVVM 需先出 ADR（PLAYBOOK-ARCHITECTURE 原则0）。
# ============================================================

meta:
  app_name: __APP_NAME__          # 项目名（自动填）
  created_at: __DATE__            # init 日期（自动填）

flutter_sdk: stable               # stable(默认,跟最新,零维护) | 具体版本如 3.24.5（pin：本机与 CI 可复现；init 自动同步进 ci.yml）

architecture:
  pattern: mvvm                   # mvvm | mvc | clean | mvi（非 mvvm 需 ADR）
  binding: riverpod               # MVVM 绑定：riverpod（默认）

state_management: riverpod        # riverpod(默认) | provider | bloc | getx | setstate
network: dio                      # dio(默认) | http
router: go_router                 # go_router(默认) | named | navigator
serialization: json_serializable  # json_serializable(默认) | freezed | manual
mock: mocktail                    # mocktail(默认) | mockito

dependencies:                     # 运行时依赖（key: "版本约束"，exact=锁定）
  dio: "^5.0.0"
  go_router: "^14.0.0"
  flutter_riverpod: "^2.0.0"
  json_annotation: "^4.9.0"

dev_dependencies:                 # 开发依赖
  json_serializable: "^6.0.0"
  build_runner: "^2.4.0"
  mocktail: "^1.0.0"

conventions:                      # 工程约定（同步进 AGENTS.md）
  import_style: package           # package(默认) | relative
  i18n: hardcoded_zh              # hardcoded_zh(默认) | intl
  naming_state_file: providers    # providers(默认 riverpod) | view_model | bloc

notes: >-                         # 选型理由/备注（写清为什么，将来复盘）
  默认选型来自 flutter-dev-kit preset：中小型 MVVM 项目的平衡组合。
